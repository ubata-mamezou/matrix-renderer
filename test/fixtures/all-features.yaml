title: Full feature regression # マトリクスタイトル
width: 800 # マトリクスの幅
lineColor: "#8798a8" # マトリクスの罫線色
xAxis:
  label: Lifecycle # x軸のラベル
  values: # x軸の設定
    - label: Plan # 列ラベル
      color: "#d6eaf8" # 列の色
      sub-labels:
        - label: Preparation
          sub-labels:
            - Research
            - Scoping
        - Design
    - Doing # 列ラベル（色指定なし）
    - label: Review
      color: "#f4e2ad"
    - label: Done # 列ラベル（色指定なし、属性名あり）
yAxis: # y軸の設定
  label: Category # y軸のラベル
  values:
    - label: Operations # 行のラベル
      color: "#c5e4ec" # 行の色
      sub-labels:
        - label: Live
          sub-labels:
            - Alert
            - Fix
        - Policy
    - label: Data # 行のラベル（色指定なし）
      sub-labels:
        - Store
    - label: Business # 行のラベル（色指定なし、属性名あり）
items: # プロットするアイテムの設定
  - id: linked-guide # アイテムのID
    label: Linked operational guide with a long label # アイテムのラベル
    lane: Alert # アイテムが属する行
    from: Research # アイテムの開始列
    to: Research # アイテムの終了列
    url: https://example.com/guide # アイテムのリンク
    color: "#245080" # アイテムの色
  - id: overlapping-guide
    label: Overlapping guide
    lane: Alert
    from: Research
    to: Review
    color: "#abc"
  - id: data-tool
    label: Data tool
    lane: Store
    from: Doing
    to: Review
    before-item: data-foundation # data-foundationの右側に配置
  - id: data-foundation
    label: Data foundation
    lane: Store
    from: Research
    to: Research
