name: Reusable build

on:
  workflow_call:
    inputs:
      run_node_matrix:
        description: Run optional Node.js 24 and 26 compatibility checks
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Build, Test and Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run static analysis
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Verify npm signatures and provenance
        run: npm audit signatures

      - name: Audit known vulnerabilities
        run: npm audit --audit-level=high

      - name: Render examples
        run: npm run render:examples

      - name: Verify package contents
        run: npm pack --dry-run

  code-security:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  node-compatibility:
    name: Optional Node.js ${{ matrix.node-version }} verification
    if: github.event_name == 'workflow_dispatch' && inputs.run_node_matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Render examples
        run: npm run render:examples
