name: CI and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_node_matrix:
        description: Run optional Node.js 24 and 26 compatibility checks
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    uses: ./.github/workflows/_version-resolver.yaml

  build:
    uses: ./.github/workflows/_build.yaml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      run_node_matrix: ${{ github.event_name == 'workflow_dispatch' && inputs.run_node_matrix || false }}

  release:
    name: Create release and stage package
    if: github.event_name == 'push' && needs.version.outputs.version_changed == 'true'
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$TARGET_SHA" --title "$TAG" --generate-notes
          fi

      - name: Stage package for review
        run: npm stage publish
