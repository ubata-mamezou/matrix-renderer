name: Scorecard supply-chain security
on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1' # 毎週月曜に定期スキャン
  push:
    branches: [ "main" ]

# 既定ではすべての権限を無効化し、ジョブで必要な権限だけ付与する
permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scorecardによる解析を実行する
      # 結果はSARIF形式で保存され、必要に応じて公開される
      # * 公開する場合：publish_results を true に設定し、id-token: write も有効にする
      # * 公開しない場合：publish_results を false に設定する
      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: "Save results for inspection"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      # Code Scanning結果を登録
      # * security-events: write と合わせて有効にする
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
