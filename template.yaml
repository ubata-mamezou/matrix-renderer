title: テンプレートです # マトリクスタイトル
width: 800 # マトリクスの幅
xAxis:
  label: X軸の説明 # x軸のラベル
  values: # x軸の設定
    - label: 列１ # 列ラベル
      color: "#d6eaf8" # 列の色
    - label: 列２ # 列ラベル（色指定なし）
    - label: 列３
      color: "#f4e2ad"
yAxis: # y軸の設定
  label: Y軸の説明 # y軸のラベル
  values:
    - label: 行１ # 行のラベル
      color: "#c5e4ec" # 行の色
    - label: 行２ # 行のラベル（色指定なし）
items: # プロットするアイテムの設定
  - id: item1 # アイテムのID
    label: アイテム１ # アイテムのラベル
    lane: 行１ # アイテムが属する行
    from: 列１ # アイテムの開始列
    to: 列１ # アイテムの終了列
    url: https://example.com/guide # アイテムのリンク
    color: "#245080" # アイテムの色
